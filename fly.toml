# fly.toml app configuration file generated for tasty-app-bff on 2026-09-09T22:58:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tasty-app-bff'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
  processes = ['app']
  size = 'shared-cpu-2x'
