spring:
  application:
    name: tasty-app-bff
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true

server:
  port: 8081
  servlet:
    contextPath: /tasty-app-bff

health:
  config:
    enabled: false

management:
  endpoint:
    health:
      show-details: always
    web:
      exposure:
        include: health,info
